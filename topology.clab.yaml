name: ceos-routing-lab
prefix: ""

mgmt:
  network: custom-mgmt-net
  mtu: 1500
  ipv4-subnet: 172.100.100.0/24
  ipv4-range: 172.100.100.128/25

topology:
  kinds:
    arista_ceos:
      image: ceos:4.35.0F
    linux:
      image: debian-nettools:latest
  nodes:
    eos1:
      kind: arista_ceos
      startup-config: configs/eos1-startup-config.cfg
    eos2:
      kind: arista_ceos
      startup-config: configs/eos2-startup-config.cfg
    isp1:
      kind: arista_ceos
      startup-config: configs/isp1-startup-config.cfg
    isp2:
      kind: arista_ceos
      startup-config: configs/isp2-startup-config.cfg
    wan-simulate:
      kind: linux
      mgmt-ipv4: 172.100.100.200
      binds:
          - configs/wan-simulate-setup.sh:/usr/local/bin/wan-simulate-setup.sh
      exec:
          - /usr/local/bin/wan-simulate-setup.sh 
    lan-eos:
      kind: arista_ceos
      startup-config: configs/lan-eos-startup-config.cfg
    lan-pc1:
      kind: linux
      binds:
          - configs/lan-pc1-setup.sh:/usr/local/bin/lan-pc1-setup.sh
      exec:
          - /usr/local/bin/lan-pc1-setup.sh 
    lan-pc2:
      kind: linux
      binds:
          - configs/lan-pc2-setup.sh:/usr/local/bin/lan-pc2-setup.sh
      exec:
          - /usr/local/bin/lan-pc2-setup.sh 
  links:
    - endpoints: ["lan-pc1:eth1", "lan-eos:eth2"]
    - endpoints: ["lan-pc2:eth1", "lan-eos:eth3"]
    - endpoints: ["eos1:eth2", "lan-eos:eth1"]
    - endpoints: ["eos1:eth1", "isp1:eth1"]
    - endpoints: ["eos2:eth1", "isp2:eth1"]
    - endpoints: ["isp1:eth2", "wan-simulate:eth1"]
    - endpoints: ["isp2:eth2", "wan-simulate:eth2"]
