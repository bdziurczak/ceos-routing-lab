!
no aaa root
!
username admin privilege 15 secret admin
!
hostname isp2
!
interface Ethernet1
   no switchport
   ip address 10.2.2.1/24
!
interface Ethernet2
   no switchport
   ip address 203.20.0.113/24
!
interface Loopback0
   ip address 112.112.113.1/24
!
ip routing
ip route 203.10.0.0/24 203.20.0.1
!
router bgp 60
   neighbor 10.2.2.20 remote-as 70
   neighbor 203.10.0.113 remote-as 55
   neighbor 203.10.0.113 ebgp-multihop 2
   address-family ipv4
      network 10.2.2.0/24
      network 203.20.0.0/24
      network 112.112.113.0/24
!
end