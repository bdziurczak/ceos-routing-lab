!
no aaa root
!
username admin privilege 15 secret admin
!
hostname lan-eos
!
interface Ethernet1
   no switchport
   ip address 192.168.150.130/25
!
dhcp server 
  subnet 192.168.150.0/28
  default-gateway 192.168.150.1
  range 192.168.150.2 192.168.150.15
  lease time ipv4 0 days 0 hours 45 minutes
  dns server ipv4 1.1.1.1
  subnet 192.168.150.16/28
  default-gateway 192.168.150.17
  range 192.168.150.18 192.168.150.30
  lease time ipv4 0 days 0 hours 45 minutes
  dns server ipv4 1.1.1.1
!
vlan 10
   name VLAN10
vlan 20
   name VLAN20
!
interface Ethernet2
   switchport
   switchport mode access
   switchport access vlan 10
!
interface Ethernet3
   switchport
   switchport mode access
   switchport access vlan 20
!
interface Vlan10
   ip address 192.168.150.1/28
   dhcp server ipv4
!
interface Vlan20
   ip address 192.168.150.17/28
   dhcp server ipv4
!
interface Loopback0
   ip address 112.112.116.1/24
!
ip routing
ip route 0.0.0.0/0 192.168.150.129
!
end
