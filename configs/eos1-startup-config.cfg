!
no aaa root
!
username admin privilege 15 secret admin
!
hostname eos1
!
interface Ethernet1
   no switchport
   ip address 10.1.1.10/24
!
interface Ethernet2
   no switchport
   ip address 192.168.150.129/25
!
interface Loopback0
   ip address 112.112.114.1/24
!
ip routing
!
router bgp 50 
   neighbor 10.1.1.1 remote-as 55
   address-family ipv4
      network 112.112.114.0/24
      network 192.168.150.128/25
!
end