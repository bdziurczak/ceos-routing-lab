!
no aaa root
!
username admin privilege 15 secret admin
!
hostname isp1
!
interface Ethernet1
   no switchport
   ip address 10.1.1.1/24
!
interface Ethernet2
   no switchport
   ip address 203.10.0.113/24
!
ip routing
ip route 203.20.0.0/24 203.10.0.1
!
ip prefix-list STATIC-OUT seq 5 permit 203.20.0.0/24
!
route-map REDIST-STATIC permit 10
   match ip address prefix-list STATIC-OUT
!
router bgp 55
   neighbor 10.1.1.10 remote-as 50
   neighbor 203.20.0.113 remote-as 60
   neighbor 203.20.0.113 ebgp-multihop 2
   address-family ipv4
      network 10.1.1.0/24
      redistribute static route-map REDIST-STATIC
!
end