!
no aaa root
!
username admin privilege 15 secret admin
!
hostname lan-eos
!
interface Ethernet1
   no switchport
   ip address 192.168.150.130/25
!
interface Ethernet2
   switchport
   switchport mode access
   switchport access vlan 10
!
interface Ethernet3
   switchport
   switchport mode acc
   ess
   switchport access vlan 20
!
interface Vlan10
   ip address 192.168.150.1/28
!
interface Vlan20
   ip address 192.168.150.17/28
!
ip dhcp pool VLAN10
   network 192.168.150.0/28
   default-router 192.168.150.1
   dns-server 8.8.8.8
   lease 600 
!
ip dhcp pool VLAN20
   network 192.168.150.16/28
   default-router 192.168.150.17
   dns-server 8.8.8.8
   lease 600 
!
interface Loopback0
   ip address 112.112.116.1/24
!
ip routing
ip route 0.0.0.0/0 192.168.150.129
!
end
