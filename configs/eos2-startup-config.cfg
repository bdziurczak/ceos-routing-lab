!
no aaa root
!
username admin privilege 15 secret admin
!
hostname eos2
!
interface Ethernet1
   no switchport
   ip address 10.2.2.20/24
!
interface Loopback0
   ip address 112.112.115.1/24
!
ip routing
!
ip route 0.0.0.0/0 10.2.2.1
!
router bgp 70 
   network 112.112.115.0/24
   neighbor 10.2.2.1 remote-as 60
!
end